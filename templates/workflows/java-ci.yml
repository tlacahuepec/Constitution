name: Java CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Run Static Analysis (SpotBugs)
        run: ./gradlew spotbugsMain

      - name: Run Tests with JaCoCo Coverage Check
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Build
        run: ./gradlew assemble

  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
